function cfInit(){clearInterval(cf.t);const w=$('#cf');if(!w)return;cf.hold=false;let x0=0,moved=false;
w.addEventListener('mouseenter',()=>cf.hold=true);w.addEventListener('mouseleave',()=>cf.hold=false);w.addEventListener('focusin',()=>cf.hold=true);w.addEventListener('focusout',()=>cf.hold=false);
w.addEventListener('touchstart',ev=>{x0=ev.touches[0].clientX;moved=false},{passive:true});
w.addEventListener('touchend',ev=>{const dx=ev.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){moved=true;cfGo(cf.i+(dx<0?1:-1));cfPlay()}});
w.addEventListener('click',ev=>{const a=ev.target.closest('.cfi');if(!a)return;const k=+a.dataset.i;if(moved){ev.preventDefault();moved=false;return}if(k!==cf.i){ev.preventDefault();cfGo(k);cfPlay()}});
w.querySelectorAll('.cfi').forEach(el=>{el.style.transition='none'});cfGo(0);requestAnimationFrame(()=>requestAnimationFrame(()=>w.querySelectorAll('.cfi').forEach(el=>{el.style.transition=''})));cfPlay()}
const sl={i:0,t:null,hold:false};
function slGo(n){const s=document.querySelectorAll('#sl .slide'),d=document.querySelectorAll('#sl .sd button');if(!s.length)return;sl.i=(n+s.length)%s.length;s.forEach((x,k)=>x.classList.toggle('on',k===sl.i));d.forEach((x,k)=>x.classList.toggle('on',k===sl.i))}
function slPlay(){clearInterval(sl.t);if(!$('#sl')||matchMedia('(prefers-reduced-motion:reduce)').matches)return;sl.t=setInterval(()=>{if(!document.hidden&&!sl.hold)slGo(sl.i+1)},5000)}
function slInit(){const el=$('#sl');sl.i=0;sl.hold=false;if(el){let x0=0;el.addEventListener('mouseenter',()=>sl.hold=true);el.addEventListener('mouseleave',()=>sl.hold=false);el.addEventListener('focusin',()=>sl.hold=true);el.addEventListener('focusout',()=>sl.hold=false);el.addEventListener('touchstart',ev=>{x0=ev.touches[0].clientX},{passive:true});el.addEventListener('touchend',ev=>{const dx=ev.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){slGo(sl.i+(dx<0?1:-1));slPlay()}})}slPlay()}
function reveal(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);setTimeout(()=>x.target.classList.remove('rv','in'),1200)}}),{threshold:.1,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('#app .card,#app .head,#app .feat>div,#app .bundle,#app .slider,#app .news,#app details,#app .box,#app .strip').forEach(el=>{const i=[...el.parentNode.children].indexOf(el);el.style.setProperty('--d',(i%4)*90+'ms');el.classList.add('rv');io.observe(el)})}
function route(){let h=(location.hash||'#home').slice(1),r=h,arg;
if(h.startsWith('guide-')){r='guide';arg=h.slice(6)}
else if(h.startsWith('shop-')){S.cat=h.slice(5);r='shop'}
else if(h==='shop'&&!/^shop-/.test(h)){}
document.title=(r==='home'?'':r[0].toUpperCase()+r.slice(1)+' · ')+C.name;
const ap=$('#app');ap.innerHTML=(V[r]||V.nf)(arg);ap.classList.remove('pgin');void ap.offsetWidth;ap.classList.add('pgin');reveal();slInit();cfInit();$('#nav').classList.remove('open');
document.querySelectorAll('[data-n]').forEach(a=>a.classList.toggle('on',a.dataset.n===r||(r==='guide'&&a.dataset.n==='shop')));
window.scrollTo(0,0)}
document.addEventListener('click',ev=>{const t=ev.target.closest('button,[data-add]');if(!t)return;const d=t.dataset;
if(COMING&&(d.add||d.buy||d.order!==undefined)){ev.preventDefault();soon(t);return}
if(d.add){ev.preventDefault();if(addItem(d.add))toast(d.add==='bundle'?'Bundle added to cart':'Added to cart')}
else if(d.buy){ev.preventDefault();if(addItem(d.buy)||cart.bundle)location.hash='#checkout'}
else if(d.qty){const[i,n]=d.qty.split(':');cart[i]=Math.max(1,cart[i]+ +n);save();route()}
else if(d.rm!==undefined){delete cart[d.rm];save();route()}
else if(d.cfd){cfGo(+d.cfd);cfPlay()}
else if(d.sl){slGo(sl.i+ +d.sl);slPlay()}
else if(d.sd){slGo(+d.sd);slPlay()}
else if(d.menu!==undefined)$('#nav').classList.toggle('open');
else if(d.theme!==undefined){const dk=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;const v=dk?'light':'dark';document.documentElement.dataset.theme=v;try{localStorage.setItem('wgu-theme',v)}catch(_){}}
else if(d.order!==undefined)toast('Demo only: connect your order system')
else if(d.msg!==undefined)toast('Demo only: connect your form service')});
document.addEventListener('input',ev=>{const t=ev.target;if(t.matches('[data-q],[data-cat],[data-sort]')){if(t.matches('[data-q]'))S.q=t.value;if(t.matches('[data-cat]'))S.cat=t.value;if(t.matches('[data-sort]'))S.sort=t.value;$('#grid').innerHTML=gridHTML()}});
try{const v=localStorage.getItem('wgu-theme');if(v)document.documentElement.dataset.theme=v}catch(_){}
addEventListener('hashchange',route);chrome();save();route();
</script>
